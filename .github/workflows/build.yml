name: Build RandomSpawn

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RandomSpawn.csproj
      - name: Build
        run: dotnet build RandomSpawn.csproj --configuration Release --no-restore
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: RandomSpawn
          path: bin/Release/net10.0/RandomSpawn.dll
